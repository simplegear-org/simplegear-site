<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060D1A">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/site.css">
  <title>PeerLink</title>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">PeerLink</p>
        <h1>Opening invite</h1>
        <p class="lead">If this was an invite link, PeerLink will open automatically.</p>
        <div class="hero-actions">
          <a class="button primary" id="open-invite-link" href="/">Open PeerLink</a>
          <a class="button ghost" href="/">Home</a>
        </div>
      </div>
      <div class="hero-card" id="invite-card">
        <span class="status-dot"></span>
        <h2>Checking link</h2>
        <p id="invite-message">Looking for an invite payload.</p>
      </div>
    </section>
  </main>
  <script src="/site.js"></script>
</body>
</html>
